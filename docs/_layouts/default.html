<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/archive.css' | relative_url }}">
</head>
<body>
  <div class="classification">公開区分：一般公開</div>
  <header class="site-header">
    <div class="header-inner">
      <div class="identity">
        <p class="organization">東彁総合研究所　記録編纂課</p>
        <p class="site-name">公開記録保管庫</p>
      </div>
      <div class="site-logo" aria-label="未整理事項枠">
        <img src="{{ '/assets/img/tokka-logo.svg' | relative_url }}" alt="未整理事項枠">
      </div>
    </div>
  </header>

  <main class="page-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div>東彁総合研究所　公開記録管理系</div>
    <div>本サイトに掲載される組織・人物・事象は架空です。</div>
  </footer>

  <script src="{{ '/assets/js/archive.js' | relative_url }}" defer></script>
</body>
</html>
