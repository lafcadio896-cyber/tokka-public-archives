name: Update site manifest

on:
  push:
    branches: [main]
    paths:
      - "archives/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build public record manifest
        run: python scripts/build_site_manifest.py

      - name: Commit manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/assets/data/records.json; then
            echo "Manifest is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/records.json
          git commit -m "公開記録一覧を更新"
          git push
